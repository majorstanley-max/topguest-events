<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | TOPGUEST EVENTS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171717;
      font-family: Arial, sans-serif;
      color: #fff;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      background: #242424;
      border: 1px solid #444;
      border-radius: 12px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #171717;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #ffe2a3;
      color: #171717;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      font-size: 13px;
      color: #ff8585;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Admin Access</h1>
    <p class="subtitle">TOPGUEST EVENTS — Private Dashboard</p>

    <form id="loginForm">
      <label for="email">Gmail Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your Gmail"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginButton">Sign In</button>

      <p id="message"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const response = await fetch("https://topguest-events-api.onrender.com/api/admin/login", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Login failed.");
        }

        window.location.href = "/admin.html";

      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });
  </script>

</body>
</html>
